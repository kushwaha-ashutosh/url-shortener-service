name: urlshortener-mvp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      BASE_URL: http://localhost:8081
      # Service names resolve on the compose network; note this is
      # postgres:5432, not the host-mapped 5433 above — that mapping
      # only exists for reaching Postgres from outside Docker.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/urlshortener?sslmode=disable
      REDIS_ADDR: redis:6379
      RATE_LIMIT_REQUESTS: 20
      RATE_LIMIT_WINDOW_SECONDS: 60
      ALLOWED_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
