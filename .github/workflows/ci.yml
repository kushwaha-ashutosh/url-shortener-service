name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          # v6 of this action can't install golangci-lint v2 binaries at
          # all ("golangci-lint v2 is not supported by
          # golangci-lint-action v6"), and v2's "latest" resolves to a
          # v1 binary built with Go 1.24, which refuses to lint a module
          # targeting Go 1.25 — so both the action and the version need
          # to be pinned. v2.13.2 verified locally with zero issues.
          version: v2.13.2
